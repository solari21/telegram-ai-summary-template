name: Telegram AI - Slot Summaries (Morning, Midday, Evening)

on:
  schedule:
    # 07:00 Madrid time (CET UTC+1 -> 06:00 UTC) -> 06:02 UTC
    - cron: '2 6 * * *'
    # 14:30 Madrid time (CET UTC+1 -> 13:30 UTC) -> 13:32 UTC
    - cron: '32 13 * * *'
    # 22:00 Madrid time (CET UTC+1 -> 21:00 UTC) -> 21:02 UTC
    - cron: '2 21 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Time slot to execute (forces slot window)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'midday'
          - 'morning'
          - 'evening'
          - 'auto'
  repository_dispatch:
    types:
      - morning_summary
      - midday_summary
      - evening_summary
      - night_summary
      - cron_trigger

jobs:
  generate-slot-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On schedule, only run if on a configured fork or manually triggered (skips scheduled runs on upstream template repository)
    if: github.repository != 'solari21/telegram-ai-summary-template' || github.event_name != 'schedule'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🌐 Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium headless browser
        run: |
          playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: 🌐 Ensure Playwright system dependencies
        run: |
          playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: 🚀 Run Slot Digest Generator & Send to Telegram
        env:
          PYTHONPATH: src
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TO: ${{ secrets.TELEGRAM_SEND_TO || 'me' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME || 'Comunidad Gamer' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
          SLOT: ${{ inputs.slot || github.event.client_payload.slot || '' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$TELEGRAM_STRING_SESSION" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Missing secrets (TELEGRAM_STRING_SESSION or GEMINI_API_KEY). Skipping execution without failure."
            exit 0
          fi
          SLOT_VAL="${{ inputs.slot || github.event.client_payload.slot || '' }}"
          CRON_VAL="${{ github.event.schedule || '' }}"
          CMD="python -m telegram_ai_summary.cli run"
          if [ -n "$CRON_VAL" ]; then
            CMD="$CMD --cron-trigger \"$CRON_VAL\""
          fi
          if [ -n "$SLOT_VAL" ] && [ "$SLOT_VAL" != "auto" ]; then
            CMD="$CMD --slot \"$SLOT_VAL\""
          fi
          echo "Executing: $CMD"
          eval $CMD
