name: Telegram AI - Slot Summaries (Morning, Midday, Evening)

on:
  schedule:
    # 07:00 Madrid time (CEST UTC+2 -> 05:00 UTC) -> 05:02 UTC (avoids :00 peak congestion)
    - cron: '2 5 * * *'
    # 14:30 Madrid time (CEST UTC+2 -> 12:30 UTC) -> 12:32 UTC (avoids :30 peak congestion)
    - cron: '32 12 * * *'
    # 22:00 Madrid time (CEST UTC+2 -> 20:00 UTC) -> 20:02 UTC (avoids :00 peak congestion)
    - cron: '2 20 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Time slot to execute (forces slot window)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'midday'
          - 'morning'
          - 'evening'
          - 'auto'
  repository_dispatch:
    types:
      - morning_summary
      - midday_summary
      - evening_summary
      - night_summary
      - cron_trigger

jobs:
  generate-slot-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On schedule, only run if on a configured fork or manually triggered (skips scheduled runs on upstream template repository)
    if: github.repository != 'solari21/telegram-ai-summary-template' || github.event_name != 'schedule'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🌐 Install Playwright Chromium headless browser
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Run Slot Digest Generator & Send to Telegram
        env:
          PYTHONPATH: src
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TO: ${{ secrets.TELEGRAM_SEND_TO || 'me' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME || 'Comunidad Gamer' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
          SLOT: ${{ inputs.slot || github.event.client_payload.slot || '' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$TELEGRAM_STRING_SESSION" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Missing secrets (TELEGRAM_STRING_SESSION or GEMINI_API_KEY). Skipping execution without failure."
            exit 0
          fi
          python -m telegram_ai_summary.cli run \
            --slot "${{ inputs.slot || github.event.client_payload.slot || '' }}" \
            --cron-trigger "${{ github.event.schedule }}"
