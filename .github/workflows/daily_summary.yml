name: Telegram AI - Slot Summaries (Morning, Midday, Evening)

on:
  schedule:
    # 07:00 Madrid time (CEST UTC+2 -> 05:00 UTC / CET UTC+1 -> 06:00 UTC)
    - cron: '0 5 * * *'
    # 14:30 Madrid time (CEST UTC+2 -> 12:30 UTC / CET UTC+1 -> 13:30 UTC)
    - cron: '30 12 * * *'
    # 22:00 Madrid time (CEST UTC+2 -> 20:00 UTC / CET UTC+1 -> 21:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  generate-slot-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Install Playwright Chromium headless browser
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Run Slot Digest Generator & Send to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TO: ${{ secrets.TELEGRAM_SEND_TO || 'me' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME || 'Comunidad Gamer' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
        run: |
          python -m telegram_ai_summary.cli run
