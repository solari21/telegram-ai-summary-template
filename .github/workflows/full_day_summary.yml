name: Telegram AI - Full Day Digest (24 Hours)

on:
  schedule:
    # 23:58 Madrid time (CET UTC+1 -> 22:58 UTC)
    - cron: '58 22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - full_day_summary

jobs:
  generate-full-day-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On schedule, only run if on a configured fork or manually triggered (skips scheduled runs on upstream template repository)
    if: github.repository != 'solari21/telegram-ai-summary-template' || github.event_name != 'schedule'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🌐 Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium headless browser
        run: |
          playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: 🌐 Ensure Playwright system dependencies
        run: |
          playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: 🚀 Run Full Day Digest Generator (00:00 - 23:59) & Send to Telegram
        env:
          PYTHONPATH: src
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TO: ${{ secrets.TELEGRAM_SEND_TO || 'me' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME || 'Comunidad Gamer' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$TELEGRAM_STRING_SESSION" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Missing secrets (TELEGRAM_STRING_SESSION or GEMINI_API_KEY). Skipping execution without failure."
            exit 0
          fi
          python -m telegram_ai_summary.cli run --full-day
