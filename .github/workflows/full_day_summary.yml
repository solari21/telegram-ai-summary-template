name: Telegram AI - Full Day Digest (24 Hours)

on:
  schedule:
    # 23:58 Madrid time (CEST UTC+2 -> 21:58 UTC / CET UTC+1 -> 22:58 UTC)
    - cron: '58 21 * * *'
  workflow_dispatch:
  repository_dispatch:
    types:
      - full_day_summary

jobs:
  generate-full-day-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On schedule, only run if secrets are configured (skips cleanly on upstream template without error emails)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (secrets.TELEGRAM_STRING_SESSION != '' && secrets.GEMINI_API_KEY != '') }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🌐 Install Playwright Chromium headless browser
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Run Full Day Digest Generator (00:00 - 23:59) & Send to Telegram
        env:
          PYTHONPATH: src
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TO: ${{ secrets.TELEGRAM_SEND_TO || 'me' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMUNITY_NAME: ${{ vars.COMMUNITY_NAME || 'Comunidad Gamer' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          python -m telegram_ai_summary.cli run --full-day
